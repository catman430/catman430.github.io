# Site settings
title: "Malek AOUADJ"
first_name: "Malek"
middle_name: ""
last_name: "AOUADJ"
contact_note: >
  Contactez-moi de préférence par email.
description: >
  Ingénieur R&D Senior - Systèmes Critiques Défense-Grade.
  Expert en robustesse décisionnelle, architectures cognitives distribuées,
  mécatronique avancée et sûreté de fonctionnement.
footer_text: >
  Propulsé par <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> et hébergé par <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords: "systèmes critiques, défense-grade, IA embarquée, systèmes autonomes, mécatronique, sûreté, DGA, SCAC, HMI"

lang: fr
icon: "🇫🇷"

url: "https://catman430.github.io"
baseurl: "/"
last_updated: true
back_to_top: true

# Social
social:
  github: "catman430"
  linkedin: "malek-aouadj"
  google_scholar_id: ""

# Navigation
navigation:
  navbar_fixed: true
  footer_fixed: true

# Theme / Appearance
theme: al_folio_core
repo_color_theme:
  light: default
  dark: dark

# Plugins (vérifier compatibilité GitHub Pages)
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jemoji

# Markdown / highlighting
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - bin/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

keep_files:
  - CNAME
  - .nojekyll

sass:
  style: compressed

# Site-specific flags
site_settings:
  dernier_mise_a_jour: true
  retour_en_haut: true
