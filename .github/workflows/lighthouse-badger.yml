# Lighthouse-Badger-Easy | GitHub Action Workflow
#
# Description: Generates, adds & updates manually/automatically Lighthouse badges & reports from one/multiple input URL(s) to the current repository & main branch with minimal settings
# Author: Sitdisch
# Source: https://github.com/myactionway/lighthouse-badger-workflows
# License: MIT
# Copyright (c) 2021 Sitdisch

name: "Lighthouse Badger"

########################################################################
# NOTE ABOUT THE CHECKOUT TOKEN
#
# This workflow may need to push files to another repository/branch (controlled by REPO_BRANCH).
# - If you operate only inside this same repository, you can use the automatically provided
#   `secrets.GITHUB_TOKEN` (it is set by GitHub Actions and requires no manual setup).
# - If the workflow must push to a different repository or needs elevated permissions,
#   create a Personal Access Token (PAT) and add it as a repository secret named
#   `LIGHTHOUSE_BADGER_TOKEN`. Example steps to create the secret:
#     1. Create a PAT at https://github.com/settings/tokens (Generate new token).
#        - Recommended scopes: `repo` (for push access to repositories you target).
#        - If you restrict access to organization repos or need additional scopes, add them accordingly.
#     2. In the GitHub repository, go to Settings → Secrets and variables → Actions → New repository secret.
#     3. Name the secret `LIGHTHOUSE_BADGER_TOKEN` and paste the PAT value.
#     4. This workflow will then use that secret for cross-repo pushes.
#
# Keep the token secret and avoid printing it in logs. The workflow below expects
# `LIGHTHOUSE_BADGER_TOKEN` to exist when you need a PAT; otherwise the checkout step
# will automatically fall back to `secrets.GITHUB_TOKEN`.
########################################################################

########################################################################
# DEFINE YOUR INPUTS AND TRIGGERS IN THE FOLLOWING
########################################################################

# INPUTS as Secrets (env) for not manually triggered workflows
env:
  URLS: https://alshedivat.github.io/al-folio/
  # If any of the following env is blank, a default value is used instead
  REPO_BRANCH: "${{ github.repository }} master" # target repository & branch e.g. 'dummy/mytargetrepo main'
  MOBILE_LIGHTHOUSE_PARAMS: "--only-categories=performance,accessibility,best-practices,seo --throttling.cpuSlowdownMultiplier=2"
  DESKTOP_LIGHTHOUSE_PARAMS: "--only-categories=performance,accessibility,best-practices,seo --preset=desktop --throttling.cpuSlowdownMultiplier=1"

# TRIGGERS
on:
  page_build:
  # schedule: # Check your schedule here => https://crontab.guru/
  #   - cron: '55 23 * * 0' # e.g. every Sunday at 23:55
  #
  # THAT'S IT; YOU'RE DONE;
  workflow_dispatch:

########################################################################
# THAT'S IT; YOU DON'T HAVE TO DEFINE ANYTHING IN THE FOLLOWING
########################################################################

jobs:
  lighthouse-badger-easy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preparatory Tasks
        run: |
          REPOSITORY=`expr "${{ env.REPO_BRANCH }}" : "\([^ ]*\)"`
          BRANCH=`expr "${{ env.REPO_BRANCH }}" : ".* \([^ ]*\)"`
          echo "REPOSITORY=$REPOSITORY" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        env:
          REPO_BRANCH: ${{ env.REPO_BRANCH }}
      - name: Warn if LIGHTHOUSE_BADGER_TOKEN is missing (non-blocking)
        run: |
          if [ -z "${{ secrets.LIGHTHOUSE_BADGER_TOKEN }}" ]; then
            echo "::warning::LIGHTHOUSE_BADGER_TOKEN secret is not set. The workflow will continue and attempt to use GITHUB_TOKEN for same-repo operations." 
            echo "If you need cross-repo push permissions, create a PAT and add it as a secret named LIGHTHOUSE_BADGER_TOKEN."
          else
            echo "LIGHTHOUSE_BADGER_TOKEN is present. Using PAT for checkout/push operations."
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPOSITORY }}
          # Use the PAT if present; otherwise fall back to the automatically provided GITHUB_TOKEN.
          token: ${{ secrets.LIGHTHOUSE_BADGER_TOKEN || github.token }}
          ref: ${{ env.BRANCH }}
      - uses: actions/checkout@v4
        with:
          repository: "myactionway/lighthouse-badges"
          path: temp_lighthouse_badges_nested
      - uses: myactionway/lighthouse-badger-action@v2.2
        with:
          urls: ${{ env.URLS }}
          mobile_lighthouse_params: ${{ env.MOBILE_LIGHTHOUSE_PARAMS }}
          desktop_lighthouse_params: ${{ env.DESKTOP_LIGHTHOUSE_PARAMS }}
